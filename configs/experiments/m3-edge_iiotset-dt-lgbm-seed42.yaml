# M3 first real-data baseline: one seed, Decision Tree + LightGBM, complete
# Edge-IIoTset ML table (no row_limit), leakage-safe protocol. Derived from
# platform-edge_iiotset-full.yaml with the model list reduced; every other setting is
# identical so the later five-model campaign stays comparable.
name: m3-edge-iiotset-dt-lgbm-seed42
seed: 42
dataset: ../datasets/edge_iiotset-full.yaml
models:
  - ../models/decision_tree_default.yaml
  - ../models/lightgbm.yaml
split:
  strategy: stratified_holdout
  test_size: 0.3
n_jobs: 1
preprocessing:
  protocol: leakage_safe
  mi_threshold: 0.1
  mi_max_samples: 50000
  deduplicate: true
  resampling:
    strategy: none
