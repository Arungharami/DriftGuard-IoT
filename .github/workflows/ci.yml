name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Block datasets, artifacts, credentials and large files
        run: python scripts/check_repo_hygiene.py

  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints-py311.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c requirements/constraints-py311.txt
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest (synthetic fixtures only)
        run: pytest -m "not slow and not real_data" --cov --cov-report=term-missing
      - name: Portal dataset catalog in sync with registry
        run: driftguard data export-catalog --check
      - name: CLI smoke run
        run: |
          driftguard validate-config configs/experiments/smoke-synthetic.yaml
          driftguard smoke --output-dir "$RUNNER_TEMP/smoke"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/constraints-py311.txt
      - name: pip-audit (pinned Python set)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements/constraints-py311.txt --progress-spinner off
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (portal, production dependencies)
        working-directory: apps/research-portal
        run: npm audit --omit=dev --audit-level=high

  portal:
    name: Research portal (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/research-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/research-portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
