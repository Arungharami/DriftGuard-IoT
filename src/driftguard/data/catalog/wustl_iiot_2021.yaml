id: wustl_iiot_2021
name: WUSTL-IIOT-2021
publisher: Washington University in St. Louis (Zolanvari, Teixeira, Gupta, Khan, Jain)
homepage: http://www.cse.wustl.edu/~jain/iiot2/index.html
description: >-
  Network flow records (Argus features) from an IIoT testbed emulating industrial control
  systems, with command-injection, reconnaissance, DoS and backdoor traffic. The publisher
  reports 1,194,464 observations (87,016 attack, 1,107,448 normal) and 41 features after
  removal of six leaky columns.
