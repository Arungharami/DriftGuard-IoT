    Please cite this dataset as follows: M. Zolanvari, M. A. Teixeira, L. Gupta, K. M.
    Khan, and R. Jain. "WUSTL-IIOT-2021 Dataset for IIoT Cybersecurity Research,"
    Washington University in St. Louis, USA, October 2021.
  academic_use: not_stated
  commercial_use: not_stated
  raw_redistribution: not_stated
  derived_artifact_redistribution: requires_review
  attribution_required: true
  notes: >-
    The page publishes the data for cybersecurity research and asks for a citation, but
    grants no explicit license. Use for this academic study is on that basis. Written
    confirmation from the publisher should be sought before releasing any derived
    artifact.
