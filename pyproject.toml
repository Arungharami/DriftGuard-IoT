[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "driftguard-iot"
version = "0.0.1"
description = "DriftGuard-IoT: drift-aware, resource-efficient intrusion detection research package for IoT/IIoT."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
  { name = "Arun Kumar Gharami", email = "agharami2026@fau.edu" },
  { name = "Shefatha Rabbany", email = "srabbany2016@fau.edu" },
  { name = "Ankith Gajam", email = "agajam2025@fau.edu" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
  "Private :: Do Not Upload",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "imbalanced-learn>=0.12",
  "lightgbm>=4.3",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
explain = ["shap>=0.45"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "pip-audit>=2.7",
]

[project.scripts]
driftguard = "driftguard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/driftguard"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["apps", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY", "PD", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is the pytest idiom

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
files = ["src/driftguard", "scripts"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "imblearn.*", "lightgbm.*", "scipy.*", "shap.*", "pandas.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "slow: long-running test, excluded from the default CI selection",
  "real_data: requires a real downloaded dataset; never runs in CI",
]
filterwarnings = ["error::FutureWarning:driftguard.*"]

[tool.coverage.run]
source = ["driftguard"]
branch = true
